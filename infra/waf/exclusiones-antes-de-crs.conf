# Exclusiones mínimas del WAF (Q-6): una regla, un parámetro, una ruta. Se revisan en S5.
#
# 934110 (SSRF por URL de metadatos) marca el redirect_uri del login OIDC porque apunta a localhost. Es el valor que
# Keycloak valida contra los redirect URIs del cliente, así que aquí no hay SSRF posible. Se quita solo ese
# parámetro de esa regla, solo en los endpoints OIDC del realm.
SecRule REQUEST_FILENAME "@beginsWith /auth/realms/ucotest/protocol/openid-connect/" \
    "id:1000001,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=934110;ARGS:redirect_uri,\
    ctl:ruleRemoveTargetById=934110;ARGS:post_logout_redirect_uri"
