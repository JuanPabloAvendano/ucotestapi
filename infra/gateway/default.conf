# API Gateway (A-25): reparte lo que deja pasar el WAF. Reglas mínimas en S1; el endurecimiento queda en S5.
resolver 127.0.0.11 valid=10s ipv6=off;

# Si el WAF no dice el esquema original, es el de esta conexión (HTTP en S1, Q-5).
map $http_x_forwarded_proto $esquema_original {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# En modo demo el backend es el contenedor app; en desarrollo corre en el host (Q-4, Q-5). Con `resolve`, Nginx
# arranca aunque uno de los dos nombres no exista y usa el de respaldo cuando el principal no responde.
upstream backend {
    zone backend 64k;
    server app:8080 resolve;
    server host.docker.internal:8081 resolve backup;
}

upstream keycloak {
    zone keycloak 64k;
    server keycloak:8080 resolve;
}

upstream frontend {
    zone frontend 64k;
    server frontend:80 resolve;
}

server {
    listen 8080;
    client_max_body_size 64k;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $esquema_original;
    proxy_set_header X-Forwarded-Host $http_host;

    location /api/ {
        proxy_pass http://backend;
        proxy_next_upstream error timeout http_502;
    }

    location /auth/ {
        proxy_pass http://keycloak;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    location / {
        proxy_pass http://frontend;
    }
}
