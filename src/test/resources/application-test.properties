# Perfil de pruebas (A-62 (9)): sin vault, sin compose, sin inicializador; Postgres lo pone Testcontainers.
spring.docker.compose.enabled=false
registro.transaccion.tiempo-limite=1s
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/auth/realms/ucotest
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:1/sin-uso-en-pruebas
spring.jpa.properties.hibernate.session_factory.statement_inspector=co.edu.uco.ucotestapi.SentenciasCapturadas
