spring.application.name=ucotest
# Desarrollo desde Eclipse en 8081 para no chocar con el WAF en 8080 (Q-5); el perfil demo usa 8080.
server.port=${PORT:8081}

# Secretos desde el vault (Q-18). El token llega por configtree en el compose o por SPRING_CLOUD_VAULT_TOKEN en desarrollo.
spring.config.import=optional:configtree:/run/secretos/app/,optional:vault://
spring.cloud.vault.uri=${UCOTEST_VAULT_URI:http://localhost:8200}
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=ucotest
spring.cloud.vault.fail-fast=true
# Spring Cloud 2025.1 declara compatibilidad con Boot 4.0; con 4.1 funciona igual (Q-10).
spring.cloud.compatibility-verifier.enabled=false

spring.datasource.url=${UCOTEST_DB_URL:jdbc:postgresql://localhost:5432/ucotest}
# Conexión del pool acotada (A-62 (5)); el binder pide milisegundos (COH-56).
spring.datasource.hikari.connection-timeout=2000

# Esquema desde las entidades, sin migraciones (A-23); sin sesión abierta en la vista (A-62 (6)).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Lectura estricta del cuerpo (A-26, A-62 (1)): 435.5, "435", ausente o null → 400.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-null-creator-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false

# Resource server: issuer público y claves por la red interna (A-27, Q-5).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${UCOTEST_URL_PUBLICA:http://localhost:8080}/auth/realms/ucotest
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${UCOTEST_JWK_SET_URI:http://localhost:8080/auth/realms/ucotest/protocol/openid-connect/certs}

# traceId en cada petición y en cada línea de log (A-45). Sin exportador en S1: no hay ninguno en el classpath;
# no se apaga management.tracing.export.enabled porque también apaga la propagación y la correlación del log.
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health

# Tiempo límite de la transacción del registro (A-32, Q-9).
registro.transaccion.tiempo-limite=5s

spring.docker.compose.lifecycle-management=start-only

# El escáner de ArchUnit que trae Spring Modulith aún no lee clases de Java 27 y llena el log de avisos sin efecto (§8).
logging.level.com.tngtech.archunit=ERROR
