# Parameter catalog local de S1 (A-40). Calificaciones en centésimas (A-36): 500 = 5.00.
nota.valor.minimo=0
nota.valor.maximo=500
# Días UTC inclusivos (A-40). Se acepta una fecha ISO (2026-10-31) o un desplazamiento desde hoy (-7d, +30d), que
# se resuelve en cada lectura (A-52): así la demo registra cualquier día. Para cerrar el registro, escribe fechas ISO.
nota.registro.fecha.inicio=-7d
nota.registro.fecha.fin=+30d
