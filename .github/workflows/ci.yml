# Pipeline de integración continua (ESPEC Q-17): backend, frontend y compose en cada push y PR.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · mvn verify (Java 27 + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      # Testcontainers usa el Docker del runner; las credenciales de Postgres las genera la prueba (Q-18).
      - run: ./mvnw -B -ntp verify

  frontend:
    name: frontend · vue-tsc y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build

  compose:
    name: compose · docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose --profile demo config --quiet

  azure:
    name: azure · bicep build e imágenes de infra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Compila el Bicep sin entrar a Azure; las imágenes de infra se construyen sin publicarse.
      - run: |
          az bicep build --file infra/azure/base.bicep --stdout > /dev/null
          az bicep build --file infra/azure/apps.bicep --stdout > /dev/null
      - run: |
          docker build -q infra/keycloak
          docker build -q infra/gateway
          docker build -q infra/waf
